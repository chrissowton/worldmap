<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Countries?</title>
<meta name="description" content="An open-source world map for asking questions: stack filters on language, religion, politics, wealth and geography and watch the world narrow down.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<header class="top">
  <div class="brand">
    <h1>Which Countries<span>?</span></h1>
  </div>
  <div id="modes" class="modes" role="radiogroup" aria-label="Kind of geography">
    <button type="button" role="radio" data-m="human" aria-checked="true">Human</button>
    <button type="button" role="radio" data-m="physical" aria-checked="false">Physical</button>
  </div>
  <nav id="themes" class="themes" aria-label="Browse filters by theme"></nav>
  <button id="ffBtn" class="ffbtn" type="button" title="Print or download a country factfile">📄 Factfile</button>
  <div class="add">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="addInput" type="search" autocomplete="off" placeholder="Search filters: try “religion”, “coast” or “HDI”" aria-label="Add a filter" aria-controls="addMenu" aria-expanded="false">
    <div id="addMenu" class="menu" role="listbox" hidden></div>
  </div>
  <div id="tpanel" class="tpanel" role="dialog" aria-label="Filters" hidden></div>
</header>
<div id="fcard" class="fcard" role="tooltip" hidden></div>
<div id="factfile" class="ff-overlay" role="dialog" aria-label="Country factfile" hidden></div>

<div id="task" class="task" hidden></div>
<section class="bar" aria-label="Active filters">
  <div id="chips" class="chips"></div>
  <p id="sentence" class="sentence" aria-live="polite"></p>
  <div class="viewtools">
    <div id="views" class="views" role="tablist" aria-label="How to show the results">
      <button type="button" role="tab" data-v="map" aria-selected="true"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.8 8h12.4M8 1.7c-2.2 2.4-2.2 10.2 0 12.6M8 1.7c2.2 2.4 2.2 10.2 0 12.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Map</button>
      <button type="button" role="tab" data-v="compare" aria-selected="false"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 1.5v12.5h12.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="9.5" r="1.8" fill="currentColor"/><circle cx="10.5" cy="5.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12.5" cy="10.5" r="1.2" fill="currentColor"/></svg>Compare</button>
      <button type="button" role="tab" data-v="rank" aria-selected="false"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 3h12M2 6.5h9M2 10h6M2 13.5h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Rankings</button>
      <button type="button" role="tab" data-v="trends" aria-selected="false"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M1.5 12.5l4-4.5 3 2.5 5.5-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M1.5 14.5h13" stroke="currentColor" stroke-width="1.2"/></svg>Trends</button>
    </div>
    <button type="button" id="sbsBtn" class="ghost sm" title="Compare two or three countries side by side">⇄ Side by side</button>
    <button type="button" id="shareBtn" class="ghost sm" title="Share this view, or set a task for students">🔗 Share</button>
  </div>
</section>

<main class="main">
  <div id="mapwrap" class="mapwrap">
    <svg id="map" role="img" aria-label="World map highlighting matching countries"></svg>
    <div id="starter" class="card starter"></div>
    <div id="zero" class="card zero" hidden></div>
    <div id="flowbar" class="card flowbar" hidden></div>
    <button id="mapClear" class="mapclear" type="button" hidden>✕ Clear all</button>
    <button id="mmBtn" class="mmbtn" type="button" aria-expanded="false" aria-controls="mmCard">🎨 Map style</button>
    <div id="mmCard" class="card mmcard" hidden></div>
    <div id="editor" class="card editor" hidden></div>
    <div id="legend" class="legend"></div>
    <div id="timebar" class="timebar"></div>
    <div class="zoom">
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="zreset" type="button" aria-label="Reset view">⟲</button>
      <button id="zlabels" type="button" aria-pressed="true" aria-label="Show place names, rivers and mountains" title="Place names, rivers and mountains">Aa</button>
    </div>
    <div id="tooltip" class="tooltip" hidden></div>
  </div>

  <div id="viewwrap" class="viewwrap" hidden></div>

  <aside id="results" class="results" aria-label="Results"></aside>
</main>

<div id="about" class="overlay" hidden></div>
<div id="sbs" class="ff-overlay sbs-overlay" role="dialog" aria-label="Countries side by side" hidden></div>
<div id="share" class="overlay" hidden></div>
<!--/APP-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="filters.js"></script>
<script src="physical.js"></script>
<script src="views.js"></script>
<script src="quiz.js"></script>
<script src="app.js"></script>
<script src="factfile.js"></script>
</body>
</html>
